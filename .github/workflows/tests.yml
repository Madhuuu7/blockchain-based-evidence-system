name: tests

# The three suites, on every push. They were runnable from the start -- the
# backend's integration tests use an in-memory MongoDB, the contract tests
# use Hardhat's in-process chain, and the frontend's use jsdom -- so none of
# this needs a database, a network or the deployed contract. What was missing
# was anything running them other than someone remembering to.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (19 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci
      - name: Compile
        # Separately from the tests, so a Solidity error is reported as a
        # compile failure rather than as nineteen failing tests.
        run: npx hardhat compile
      - run: npx hardhat test

  backend:
    name: backend (136 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: frontend (38 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Production build
        # The build is a test: a type error or a missing import passes the
        # component suite and fails here, which is where it is cheap to find.
        run: npm run build
